name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://teamizer:teamizer@localhost:5432/teamizer_test?schema=public
      TEST_DATABASE_URL: postgresql://teamizer:teamizer@localhost:5432/teamizer_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teamizer_test
          POSTGRES_USER: teamizer
          POSTGRES_PASSWORD: teamizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamizer -d teamizer_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm prisma:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Build and run static checks
        run: pnpm build
