services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamizer
      POSTGRES_USER: teamizer
      POSTGRES_PASSWORD: teamizer
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamizer -d teamizer']
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - teamizer-postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamizer_test
      POSTGRES_USER: teamizer
      POSTGRES_PASSWORD: teamizer
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamizer -d teamizer_test']
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  teamizer-postgres-data:
